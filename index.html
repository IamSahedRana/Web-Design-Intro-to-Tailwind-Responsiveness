         <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>

<!-- Responsive Card -->

<div class="bg-blue-500 md:bg-green-700 text-white md:text-black border-4 p-4 rounded-2xl shadow-md border-amber-500 text-2xl sm:text-[50px] xl:text-[80px] font-bold text-center mt-4"> Data Nerds</div>

 <!--  Grid Layout -->

  <h2    class="text-[50px] font-bold
           bg-linear-to-r from-blue-500 to-indigo-500
           bg-clip-text text-transparent
           mt-15
           text-center
           items-center"> Product Grid </h2>

 <div class="my-8 grid grid-cols-1 md:grid-cols-12 gap-4"> 
     
     <div class = "h-64 w-64 bg-green-500 border-black border-2 p-4 mt-5 mx-12.5 rounded-2xl my-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-3"  > BOX 1 </div>

<div class = "h-64 w-64 bg-green-500 border-black border-2 p-4 mt-5 mx-12.5 rounded-2xl my-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-6"  > BOX 2 </div>

<div class = "h-64 w-64 bg-green-500 border-black border-2 p-4 mt-5 mx-12.5 rounded-2xl my-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-3"  > BOX 3 </div>


</div>

<!-- New Card Box -->

  <h2    class="text-[50px] font-bold
           bg-linear-to-r from-red-500 to-gray-700
           bg-clip-text text-transparent
           mt-15
           text-center
           items-center"> Product Grid </h2>

<div class="flex flex-col md:flex-row justify-center items-center mt-4"> 

     <div class = "h-64 w-64 bg-green-500 border-black border-2 p-4 mt-5 mx-12.5 rounded-2xl my-4 flex justify-center items-center font-bold text-3xl"  > BOX 1 </div>

<div class = "h-64 w-64 bg-green-500 border-black border-2 p-4 mt-5 mx-12.5 rounded-2xl my-4 flex justify-center items-center font-bold text-3xl"  > BOX 2 </div>

<div class = "h-64 w-64 bg-green-500 border-black border-2 p-4 mt-5 mx-12.5 rounded-2xl my-4 flex justify-center items-center font-bold text-3xl"  > BOX 3 </div>


</div>
<!-- Product Card -->
     <div class="w-80 overflow-hidden rounded-xl bg-white shadow-lg">

  <!-- Product Image -->
  <img
    src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
    alt="Nike Running Shoes"
    class="h-56 w-full object-cover"
  />

  <!-- Product Content -->
  <div class="p-5">

    <!-- Category -->
    <p class="text-sm font-medium text-gray-500">
      Running Shoes
    </p>

    <!-- Product Name -->
    <h2 class="mt-1 text-2xl font-bold text-gray-900">
      Nike Air Max
    </h2>

    <!-- Description -->
    <p class="mt-2 text-sm leading-6 text-gray-600">
      Comfortable and stylish running shoes designed for everyday performance.
    </p>

    <!-- Price + Button -->
    <div class="mt-5 flex items-center justify-between">

      <p class="text-2xl font-bold text-gray-900">
        $129
      </p>

      <button
        class="rounded-lg bg-black px-5 py-2.5 font-semibold text-white hover:bg-gray-800"
      >
        Add to Cart
      </button>

      

    </div>

  </div>
</div>
</body>
</html>
